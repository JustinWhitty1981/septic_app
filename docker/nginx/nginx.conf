# HTTPS front door for the Septic App.
#
# Why this exists: a PWA is only installable from a secure context, and
# `http://10.x.x.x` is not one — the driver phone offers no "Add to Home
# screen" no matter what the app code does (DRV-12's trailing note). This
# file is the TLS layer, and the cert is the part you bring (see the
# certificate README next to it).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 20m;   # must clear the backend's 16 MB upload parser

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The only plaintext service on this box: ACME http-01 and the redirect.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Replaced by your real cert for the name your phones type (see
        # certs/README.md). The included make-self-signed.sh exists so a
        # developer can prove this file works — never for a handset.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;

        # The CRA dev server's hot-reload socket. Drop these two locations
        # when you swap `frontend` for a built static bundle.
        location /ws {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }
}
