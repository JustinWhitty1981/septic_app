name: septic

# Dev environment. Everything runs in containers; no host Node toolchain required.
# Usage:
#   cp .env.example .env      # then edit secrets
#   docker compose up --build
#   docker compose exec backend npx tsc --noEmit
#   docker compose exec frontend npx tsc --noEmit
#   docker compose down -v    # -v wipes the postgres + minio volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: septic-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-septic_dev}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-septic_dev_pw}
      POSTGRES_DB: ${DATABASE_NAME:-septic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the septic_app schema on first init. See the file for why.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septic_dev -d ${DATABASE_NAME:-septic}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # The legacy CSVs land in schema `legacy` of the *app* database, not a separate
  # server. ETL-07: transforms must share a transaction with the writes they
  # produce, and a cross-server load cannot be rolled back as one unit. The loader
  # streams each file over stdin, so no data volume mount is needed here.

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: septic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-septic_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-septic_dev_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Creates the media bucket once MinIO is up. Private by default.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-septic_dev} $${S3_SECRET_ACCESS_KEY:-septic_dev_secret} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-septic-media-dev} &&
      echo 'bucket ready'
      "

  backend:
    build:
      context: ./septic-app/backend
      dockerfile: Dockerfile.dev
    container_name: septic-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-septic_dev}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-septic_dev_pw}
      DATABASE_NAME: ${DATABASE_NAME:-septic}
      # No default on purpose: compose refuses to start with a missing/placeholder secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-septic-media-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-septic_dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-septic_dev_secret}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./septic-app/backend:/app
      - /app/node_modules          # anonymous: keep the image's Linux-built deps
      # Read-only so the requirements-checklist tests can read the document they
      # are checked against. Without this mount those tests silently skip, and a
      # test that cannot fail is worse than no test.
      - ./docs:/docs:ro
      # Same reasoning for the ETL suite: tests/etl.test.ts asserts that every source
      # row ended up loaded or quarantined, which needs the CSVs it reconciles
      # against. data/ is gitignored, so on a fresh clone this mount is empty and the
      # suite skips itself; on a machine that has run the loader it cannot lie.
      - ./data:/data:ro
    command: npm run dev
    restart: unless-stopped

  frontend:
    build:
      context: ./septic-app/frontend
      dockerfile: Dockerfile.dev
    container_name: septic-frontend
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      WDS_SOCKET: ws
      WATCHPACK_POLLING: "true"   # file watching across the WSL bind mount
      REACT_APP_API_BASE: /api
    ports:
      - "3000:3000"
    volumes:
      - ./septic-app/frontend:/app
      - /app/node_modules
    command: npm start

  # Playwright UI tests. Profile-gated: `docker compose up` never starts it.
  #   docker compose --profile e2e run --rm e2e
  # Expects the app on host port 5555 (port 3000 is held by the frontend
  # service). Shares the host network so localhost:5555 reaches the host's
  # mapping; override with E2E_BASE_URL. The browser version is baked into the
  # image and must match @playwright/test in e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.50.1-noble
    profiles: ["e2e"]
    network_mode: host
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://localhost:5555}
    command: >
      /bin/bash -c "
      npm install --no-audit --no-fund &&
      npx playwright test
      "

volumes:
  pgdata:
  miniodata:
